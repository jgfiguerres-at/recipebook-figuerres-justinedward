<!DOCTYPE html>
<html>
    <body>
        <h2>Recipe Book</h2>
        <form method="POST" action="{% url 'logout' %}">
            {% if not user.is_authenticated %}
                {{ form.as_p }}
            {% endif %}
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </body>
</html>
