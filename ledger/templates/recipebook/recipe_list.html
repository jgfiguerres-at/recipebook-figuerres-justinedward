{% extends 'base.html' %}

{% block title %}Recipe List{% endblock %}

{% block header %}<h3>All Recipes</h3>{% endblock %}
{% block content %}
    <ul>
        {% for recipe in recipes %}
            <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
