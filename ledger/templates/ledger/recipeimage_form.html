{% extends 'base.html' %}

{% block title %}Recipe List | Add Image {% endblock %}

{% block content %}
    <h3>Add a new image to the recipe</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Add image">
    </form>
    <br>
    <br>
    <a href="/recipe/{{ pk }}">Return to recipe</a>
{% endblock %}
