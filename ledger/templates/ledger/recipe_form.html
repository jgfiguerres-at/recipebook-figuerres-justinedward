{% extends 'base.html' %}

{% block title %}Recipe List | Add Recipe {% endblock %}

{% block content %}
    <h3>Add a new recipe</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Add recipe">
    </form>
    <br>
    <br>
    <a href="{% url 'ledger:recipe_list' %}">
        Return to recipe list
    </a>
{% endblock %}
