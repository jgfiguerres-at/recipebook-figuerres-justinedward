{% extends 'base.html' %}

{% block title %}Recipe List{% endblock %}

{% block content %}
    <h3>Recipe List</h3>
    <ul>
        {% for recipe in recipe_list %}
            <li>
                <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>
    <br>
    <a href="{% url 'ledger:recipe_create' %}">Add a new recipe</a>
{% endblock %}
